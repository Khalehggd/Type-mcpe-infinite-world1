// Root project build.gradle
// NOTE: The actual build runs from mcpe64-INFINITE-WORLD/ subdirectory.
// This file is only used if you build from the repo root.

plugins {
    // Version must match settings.gradle
    id 'com.android.application' version '8.2.0' apply false
}

allprojects {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
