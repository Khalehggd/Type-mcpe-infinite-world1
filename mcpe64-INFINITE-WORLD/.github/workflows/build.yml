name: Build Minecraft PE APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Download Android SDK and NDK
      run: |
        mkdir -p ~/Android/sdk
        cd ~/Android/sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        rm commandlinetools-linux-9477386_latest.zip
        export ANDROID_SDK_ROOT=~/Android/sdk
        export PATH=$PATH:$ANDROID_SDK_ROOT/cmdline-tools/bin
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg
        yes | cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --licenses
        cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "platforms;android-34"
        cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "build-tools;34.0.0"
        cmdline-tools/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "ndk;26.1.10909125"
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/26.1.10909125" >> $GITHUB_ENV

    - name: Grant execute permissions
      run: |
        cd mcpe64-INFINITE-WORLD
        chmod +x gradlew 2>/dev/null || true

    - name: Build APK with Gradle
      run: |
        cd mcpe64-INFINITE-WORLD
        export ANDROID_SDK_ROOT=~/Android/sdk
        export ANDROID_NDK_HOME=~/Android/sdk/ndk/26.1.10909125
        ./gradlew assembleDebug --stacktrace 2>&1 || gradle assembleDebug --stacktrace 2>&1

    - name: Find APK
      if: success()
      run: |
        find mcpe64-INFINITE-WORLD -name "*.apk" -type f
        ls -lh mcpe64-INFINITE-WORLD/app/build/outputs/apk/debug/

    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: MinecraftPE-Infinite-World-APK
        path: mcpe64-INFINITE-WORLD/app/build/outputs/apk/debug/*.apk
        retention-days: 30

    - name: Upload Build Logs on Failure
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: build-logs
        path: mcpe64-INFINITE-WORLD/app/build/outputs/
        retention-days: 7
