plugins {
    id 'com.android.application'
}

android {
    namespace "com.mojang.minecraftpe"
    compileSdk 34
    ndkVersion "26.1.10909125"

    defaultConfig {
        applicationId "com.khalehggd.minecraftpe"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        ndk {
            abiFilters 'arm64-v8a'
        }

        externalNativeBuild {
            cmake {
                // Must match CMAKE_CXX_STANDARD in CMakeLists.txt
                cppFlags "-std=c++14"
                arguments "-DANDROID_ARM_NEON=ON"
            }
        }
    }

    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }

    sourceSets {
        main {
            // Use the android_java manifest (matches java.srcDirs below)
            manifest.srcFile '../project/android_java/AndroidManifest.xml'
            java.srcDirs    = ['../project/android_java/src']
            res.srcDirs     = ['../project/android_java/res']
            assets.srcDirs  = ['../data']
        }
    }

    packagingOptions {
        // Keep the native lib uncompressed so Android can load it directly
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

dependencies {
}
