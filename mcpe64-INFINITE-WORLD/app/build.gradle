plugins {
    id 'com.android.application'
}

android {
    compileSdk 34
    ndkVersion "26.1.10909125"
    
    defaultConfig {
        applicationId "com.khalehggd.minecraftpe"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
        
        ndk {
            abiFilters 'arm64-v8a'
        }
        
        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_ARM_NEON=ON"
            }
        }
    }
    
    externalNativeBuild {
        cmake {
            path file('../CMakeLists.txt')
            version '3.22.1'
        }
    }
    
    sourceSets {
        main {
            manifest.srcFile '../project/android/AndroidManifest.xml'
            java.srcDirs = ['../project/android_java/src']
            res.srcDirs = ['../project/android_java/res']
            assets.srcDirs = ['../data']
        }
    }
}

dependencies {
}
