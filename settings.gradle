pluginManagement {
    plugins {
        id 'com.android.application' version '8.2.0'
    }
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

rootProject.name = "MinecraftPE-InfiniteWorld"
include ':app'
project(':app').projectDir = new File(settingsDir, 'mcpe64-INFINITE-WORLD/app')
